services:
  postgres:
    image: postgres:16-alpine
    container_name: bankflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankflow
      POSTGRES_USER: bankflow
      POSTGRES_PASSWORD: bankflow_local_password
    ports:
      - "5433:5432"
    volumes:
      - bankflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankflow -d bankflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bankflow_data:
